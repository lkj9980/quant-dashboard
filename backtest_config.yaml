# ==========================================
# 퀀트 전략 백테스트 설정 파일 (backtest_config.yaml)
# ==========================================

# 1. 백테스트 기간 설정 (null로 두면 quant_log.csv에 쌓인 전체 기간 자동 적용)
period:
  start_date: null   # 예: "2026-01-01"
  end_date: null     # 예: "2026-08-27"

# 2. 초기 자본금 및 비용 설정
capital:
  initial_capital: 100000000  # 초기 자본금 (기본 1억원)
  transaction_fee: 0.00015    # 거래 수수료 및 세금 (예: 0.015%)
  slippage: 0.001             # 슬리피지 가정 (예: 0.1%)

# 3. 매매 대상 티커 및 로그 CSV 컬럼 매핑 설정
# (quant_log.csv에 기록되는 비중 컬럼명과 야후 파이낸스 티커를 연결합니다)
# [Portfolio A & B 전체 자산군 매핑]
assets:
  # Portfolio A (일반 계좌)
  - name: "A_Kospi200_Lev"
    ticker: "252670.KS"
    weight_column: "A_Kospi200_Lev"
  - name: "A_Kospi200_Inv"
    ticker: "252660.KS"
    weight_column: "A_Kospi200_Inv"
  - name: "A_Kosdaq150_Lev"
    ticker: "233740.KS"
    weight_column: "A_Kosdaq150_Lev"
  - name: "A_Kosdaq150_Inv"
    ticker: "251340.KS"
    weight_column: "A_Kosdaq150_Inv"
  - name: "A_Nasdaq100_Lev"
    ticker: "379800.KS" # 예시 티커 (TIGER 미국나스닥100레버리지 등 상황에 맞게 조정)
    weight_column: "A_Nasdaq100_Lev"
  - name: "A_Nasdaq100_Inv"
    ticker: "381180.KS" # 예시 티커
    weight_column: "A_Nasdaq100_Inv"
    
  # Portfolio B (퇴직연금 DC/IRP - 위험/안전자산 세부 매핑)
  - name: "B_Kospi200"
    ticker: "069500.KS" # KODEX 200
    weight_column: "B_Kospi200"
  - name: "B_Kosdaq150"
    ticker: "229200.KS" # KODEX 코스닥150
    weight_column: "B_Kosdaq150"
  - name: "B_Nasdaq100"
    ticker: "133690.KS" # TIGER 미국나스닥100
    weight_column: "B_Nasdaq100"
  - name: "B_US_Treasury_30Y"
    ticker: "304660.KS" # TIGER 미국채30년선물
    weight_column: "B_US_Treasury_30Y"

# 4. 파일 경로 설정
paths:
  log_file: "data/quant_log.csv"
  output_report: "data/backtest_data.csv"
