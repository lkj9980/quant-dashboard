<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 퀀트 백테스트 리포트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 헤더 -->
        <header class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">📈 AI 퀀트 전략 백테스트 리포트</h1>
                <p class="text-sm text-gray-400 mt-1">최종 갱신일: <span id="updateTime">2026-09-03 12:00:00</span></p>
            </div>
            <span class="px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/30">Live Tracking</span>
        </header>

        <!-- 핵심 지표 카드 그리드 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <p class="text-sm text-gray-400">총 누적 수익률</p>
                <p id="totalReturn" class="text-2xl font-bold mt-2 text-emerald-400">+12.45%</p>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <p class="text-sm text-gray-400">최종 자산 가치</p>
                <p id="finalCapital" class="text-2xl font-bold text-white mt-2">11,245,000 원</p>
            </div>
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-5 shadow-lg">
                <p class="text-sm text-gray-400">최대 낙폭 (MDD)</p>
                <p id="mddValue" class="text-2xl font-bold text-rose-400">-3.20%</p>
            </div>
        </div>

        <!-- 자산 가치 추이 차트 섹션 -->
        <div class="bg-gray-800 border border-gray-700 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-gray-200">자산 가치 변화 추이 (Equity Curve)</h2>
            <div class="relative h-72">
                <canvas id="equityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('equityChart').getContext('2d');
        const chartData = {
            labels: ['2026-08-25', '2026-08-26', '2026-08-27', '2026-08-28', '2026-08-29', '2026-08-30', '2026-08-31', '2026-09-01', '2026-09-02', '2026-09-03'],
            datasets: [{
                label: '포트폴리오 가치 (원)',
                data: [10000000, 10050000, 10120000, 10080000, 10250000, 10400000, 10380000, 10550000, 10800000, 11245000],
                borderColor: '#34d399',
                backgroundColor: 'rgba(52, 211, 153, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.1
            }]
        };

        new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                }
            }
        });
    </script>
</body>
</html>
