name: Deploy Quant Dashboard to GitHub Pages

on:
  schedule:
    - cron: '0 8 * * *'  # [한국 시간 오전 8시]
    - cron: '30 11 * * *'  # [한국 시간 오전 11시 30분]
    - cron: '0 16 * * *'   # [한국 시간 오후 4시]
    - cron: '0 23 * * *'  # [한국 시간 오후 11시]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance google-generativeai pandas markdown
          
      - name: Run Python Analysis & Generate index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
          MY_EMAIL: ${{ secrets.MY_EMAIL }} 
        run: |
          python main.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history/
          git pull origin main --rebase || echo "No rebase needed"
          git commit -m "Auto-update dashboard and daily history archive [skip ci]" || exit 0
          git push origin main
