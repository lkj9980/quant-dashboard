name: Deploy Quant Dashboard to GitHub Pages

on:
  schedule:
    # 1. 국장 개장 후 안정화 시점 [KST 오전 09:10] (UTC 00:10)
    #- cron: '10 0 * * *'
    
    # 2. 국장 마감 종가 확정 후 [KST 오후 03:40] (UTC 06:40)
    - cron: '40 6 * * *'
    
    # 3. 미장 개장 후 안정화 시점 [KST 밤 12:00 (자정)] (UTC 15:00)
    # * 서머타임 적용 시 밤 11시가 되므로, 계절별로 유연하게 보려면 밤 12시가 안전합니다.
    #- cron: '0 15 * * *'
    
    # 4. 미장 마감 확정 후 [KST 새벽 06:10] (UTC 21:10)
    #- cron: '10 21 * * *'
    
    # 1. 국장 개장 후 안정화 시점 [KST 오전 09:10] (UTC 00:10)
    #- cron: '00 3 * * *'
    
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance google-generativeai pandas markdown
          
      - name: Run Python Analysis & Generate index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
          MY_EMAIL: ${{ secrets.MY_EMAIL }} 
        run: |
          python main.py
          
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history/
          git pull origin main --rebase || echo "No rebase needed"
          git commit -m "Auto-update dashboard and daily history archive [skip ci]" || exit 0
          git push origin main
