name: Deploy Quant Dashboard to GitHub Pages

on:
  schedule:
    - cron: '00 23 * * *' # 한국 시간 오전 8시 00분 (미장 마감 시황)
    - cron: '00 7 * * *'  # 한국 시간 오후 4시 00분 (국장 마감 시황)
    - cron: '30 2 * * *'  # 한국 시간 오전 11시 30분 (점심)
  workflow_dispatch: # 수동 실행 버튼 제공

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance google-generativeai pandas markdown
          
      - name: Run Python Analysis & Generate index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
          MY_EMAIL: ${{ secrets.MY_EMAIL }} 
        run: |
          python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git pull origin main --rebase || echo "No rebase needed"
          git commit -m "Auto-update dashboard HTML [skip ci]" || exit 0
          git push origin main
