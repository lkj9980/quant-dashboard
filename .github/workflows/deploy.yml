name: Quant Macro Automation


on:
  repository_dispatch:
    types: [run_quant_pipeline]  # 외부에서 이 이름을 부르면 실행됩니다.

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install yfinance google-generativeai pandas markdown requests

      - name: Run Python Analysis & Generate index.html
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} 
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          
      - name: Run Quant Script
        run: python main.py  # 본인의 파이썬 실행 파일명

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history/
          git pull origin main --rebase || echo "No rebase needed"
          git commit -m "Auto-update dashboard via external cron [skip ci]" || exit 0
          git push origin main
