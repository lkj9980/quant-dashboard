name: Quant Log Update

on:
  #schedule:
  #  - cron: '0 8 * * *'  # 매일 UTC 기준 오전 8시 (한국 시간 오후 5시) 자동 실행
  workflow_dispatch:

jobs:
  update-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run script
        run: |
          python test_quant.py  # 실행할 파일명에 맞춰 수정하세요

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quant_log.csv
          git diff --staged --quiet || (git commit -m "Auto-update quant_log.csv via GitHub Actions" && git push)
